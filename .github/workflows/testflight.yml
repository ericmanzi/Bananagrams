name: Deploy to TestFlight

# Mirrors SeparateCompanions' workflow: every push to main builds the iOS app
# on EAS and submits it to TestFlight. See README.md for the one-time setup:
# an App Store Connect app record, four repository secrets, and signing
# credentials assigned on EAS once by running `eas credentials:configure-build`.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - preview
      skip_build:
        description: "Skip the build and submit the latest finished build (to retry an upload)"
        required: false
        default: false
        type: boolean
      listing_only:
        description: "Only update the App Store listing (keywords); no build or upload"
        required: false
        default: false
        type: boolean

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Keeps the App Store listing's keywords in step with store/keywords.txt.
  # Harmless on every run: it only edits a version still being prepared, and
  # does nothing if the keywords already match.
  store-listing:
    name: Update App Store keywords
    needs: test
    runs-on: ubuntu-latest
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Push keywords to App Store Connect
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::No App Store Connect API key secrets; skipping the listing update."
            exit 0
          fi
          node scripts/configure-submit.js --write-key "$RUNNER_TEMP/asc_api_key.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8" node scripts/store-listing.js

  build-and-submit:
    name: Build iOS & Submit to TestFlight
    needs: test
    if: github.event.inputs.listing_only != 'true'
    runs-on: ubuntu-latest
    environment: testflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine build profile
        id: profile
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      # The projectId is committed; this only matters if app.json ever loses it.
      - name: Link EAS project
        run: |
          if ! node -e 'process.exit(require("./app.json").expo.extra?.eas?.projectId ? 0 : 1)'; then
            echo "::warning::app.json has no extra.eas.projectId; linking for this run. Run 'npx eas-cli init' and commit app.json."
            eas init --non-interactive --force
          fi

      # Signing comes from the certificate and profile stored on EAS (README,
      # one-time setup step 6). The API key is only used to find the app's
      # ascAppId and to upload the build. It is deliberately not exported as
      # EXPO_ASC_*: with those set, `eas build` logs into Apple to re-validate
      # the profile, and in eas-cli 24.8 that crashed inside @expo/apple-utils.
      - name: App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$ASC_API_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            # Rewritten as canonical PKCS#8: Expo rejects a key with anything
            # before the BEGIN line, which a pasted secret often has.
            node scripts/configure-submit.js --write-key "$RUNNER_TEMP/asc_api_key.p8"
            {
              echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8"
              echo "ASC_KEY_ID=$ASC_KEY_ID"
              echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No ASC_API_KEY_P8/ASC_KEY_ID secrets; using credentials stored on EAS."
          fi

      # Before the build, so a missing App Store Connect app fails in seconds.
      - name: Configure submit profile
        if: steps.profile.outputs.profile == 'production'
        run: |
          if [ -n "$ASC_KEY_PATH" ]; then
            node scripts/configure-submit.js
          elif grep -q REPLACE_WITH_APP_STORE_CONNECT_APP_ID eas.json; then
            echo "::error::Add the ASC_API_KEY_P8 and ASC_KEY_ID secrets, or set submit.production.ios.ascAppId in eas.json to the app's Apple ID from App Store Connect."
            exit 1
          fi

      # eas-cli prints a whole minified source line when it crashes, and GitHub
      # then drops the error after it; trimming each line keeps the error.
      # stdbuf keeps cut from holding output back, so progress shows live.
      - name: Build iOS app
        if: github.event.inputs.skip_build != 'true'
        run: |
          set -o pipefail
          eas build \
            --platform ios \
            --profile ${{ steps.profile.outputs.profile }} \
            --non-interactive \
            --wait 2>&1 | stdbuf -oL cut -c1-2000

      # Uploads wait in Expo's submission queue first, which has taken well
      # over an hour (build 5: 1h40m). Past two hours, fail visibly instead of
      # holding the runner for six; the upload runs on Expo's servers and may
      # still land (check App Store Connect), otherwise skip_build retries it.
      - name: Submit to TestFlight
        if: steps.profile.outputs.profile == 'production'
        timeout-minutes: 120
        run: |
          set -o pipefail
          eas submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive \
            --verbose 2>&1 | stdbuf -oL cut -c1-2000
